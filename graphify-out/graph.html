": "#aaaaaa", "align": "middle"}, "color": {"color": "#4a90e2", "opacity": 0.7}}, {"from": "node::sandbox_verifier_node", "to": "node::git_pr_node", "label": "TRANSITIONS_ON_PASS", "arrows": "to", "font": {"size": 10, "color": "#aaaaaa", "align": "middle"}, "color": {"color": "#4a90e2", "opacity": 0.7}}, {"from": "node::git_pr_node", "to": "node::END", "label": "TERMINATES", "arrows": "to", "font": {"size": 10, "color": "#aaaaaa", "align": "middle"}, "color": {"color": "#4a90e2", "opacity": 0.7}}];

        const nodes = new vis.DataSet(rawNodes);
        const edges = new vis.DataSet(rawEdges);

        const container = document.getElementById('network');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: {
                font: { color: '#f0f6fc', size: 12, face: 'monospace' },
                borderWidth: 1.5,
                shadow: true
            },
            edges: {
                arrows: { to: { enabled: true, scaleFactor: 0.8 } },
                smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.4 }
            },
            physics: {
                stabilization: { iterations: 200 },
                barnesHut: {
                    gravitationalConstant: -3500,
                    centralGravity: 0.25,
                    springLength: 95,
                    springConstant: 0.04
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                navigationButtons: true,
                keyboard: true
            }
        };

        const network = new vis.Network(container, data, options);

        // Node Click Inspector
        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                document.getElementById('insp-title').innerText = node.label;
                document.getElementById('insp-cat').innerText = node.category;
                document.getElementById('insp-file').innerText = node.file;
                document.getElementById('insp-doc').innerText = node.docstring || "No docstring provided.";
                document.getElementById('inspector').style.display = 'block';
            } else {
                document.getElementById('inspector').style.display = 'none';
            }
        });

        // Search Filter
        document.getElementById('search').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase().trim();
            if (!val) {
                network.fit();
                return;
            }
            const matched = rawNodes.find(n => n.label.toLowerCase().includes(val) || n.id.toLowerCase().includes(val));
            if (matched) {
                network.focus(matched.id, {
                    scale: 1.2,
                    animation: { duration: 500, easingFunction: 'easeInOutQuad' }
                });
                network.selectNodes([matched.id]);
            }
        });
